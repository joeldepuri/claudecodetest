<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TOP-DOWN SHOOTER</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ─────────────────────────────────────────────
// CANVAS SETUP
// ─────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

// ─────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────
const S = { MENU:0, PLAYING:1, LEVEL_COMPLETE:2, GAME_OVER:3 };

const EDEFS = {
  GRUNT:   { col:'#e63946', r:15, spd:95,  hp:1, sc:10, shoots:false },
  TANK:    { col:'#7b2d2d', r:23, spd:52,  hp:4, sc:30, shoots:false },
  FLANKER: { col:'#f4a261', r:13, spd:150, hp:1, sc:20, shoots:false },
  SHOOTER: { col:'#9b5de5', r:17, spd:48,  hp:2, sc:25, shoots:true  },
};

// level → array of waves → array of {type, n}
const LEVELS = [
  [ [{t:'GRUNT',n:5}], [{t:'GRUNT',n:7}], [{t:'GRUNT',n:9}] ],
  [ [{t:'GRUNT',n:6},{t:'TANK',n:1}], [{t:'GRUNT',n:8},{t:'TANK',n:2}], [{t:'GRUNT',n:10},{t:'TANK',n:3}] ],
  [ [{t:'GRUNT',n:8},{t:'FLANKER',n:3}], [{t:'TANK',n:3},{t:'FLANKER',n:5}], [{t:'GRUNT',n:10},{t:'TANK',n:2},{t:'FLANKER',n:5}], [{t:'FLANKER',n:10}] ],
  [ [{t:'GRUNT',n:8},{t:'SHOOTER',n:2}], [{t:'TANK',n:3},{t:'SHOOTER',n:3}], [{t:'FLANKER',n:6},{t:'SHOOTER',n:3}], [{t:'GRUNT',n:10},{t:'TANK',n:2},{t:'SHOOTER',n:4}] ],
  [ [{t:'GRUNT',n:6},{t:'TANK',n:2},{t:'FLANKER',n:4},{t:'SHOOTER',n:2}], [{t:'GRUNT',n:10},{t:'TANK',n:4},{t:'FLANKER',n:6},{t:'SHOOTER',n:4}], [{t:'GRUNT',n:15},{t:'TANK',n:6},{t:'FLANKER',n:8},{t:'SHOOTER',n:5}] ],
];

// ─────────────────────────────────────────────
// INPUT
// ─────────────────────────────────────────────
const keys = {};
const mouse = { x: 400, y: 300, fire: false };
let enterConsumed = false;

window.addEventListener('keydown', e => {
  if (!keys[e.code]) keys[e.code] = true;
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Enter' || e.code === 'Space') enterConsumed = false;
});
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => { if (e.button===0) mouse.fire = true; });
canvas.addEventListener('mouseup',   e => { if (e.button===0) mouse.fire = false; });
// Prevent context menu
canvas.addEventListener('contextmenu', e => e.preventDefault());

function enterPressed() {
  if ((keys['Enter'] || keys['Space']) && !enterConsumed) {
    enterConsumed = true;
    return true;
  }
  return false;
}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
const rnd  = (a,b) => Math.random()*(b-a)+a;
const rndI = (a,b) => Math.floor(rnd(a,b+1));
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const dist  = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const ang   = (a,b) => Math.atan2(b.y-a.y, b.x-a.x);

function edgePos() {
  const side = rndI(0,3);
  if (side===0) return {x:rnd(0,W), y:-40};
  if (side===1) return {x:W+40,    y:rnd(0,H)};
  if (side===2) return {x:rnd(0,W), y:H+40};
  return              {x:-40,       y:rnd(0,H)};
}

// ─────────────────────────────────────────────
// SCREEN SHAKE
// ─────────────────────────────────────────────
let shkMag=0, shkDur=0, shkX=0, shkY=0;
function shake(mag, dur) { shkMag=Math.max(shkMag,mag); shkDur=Math.max(shkDur,dur); }

// ─────────────────────────────────────────────
// PARTICLES
// ─────────────────────────────────────────────
const particles = [];

class Particle {
  constructor(x,y,vx,vy,col,life,r=3) {
    Object.assign(this,{x,y,vx,vy,col,life,maxLife:life,r});
  }
  update(dt) {
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    this.vx*=0.90; this.vy*=0.90;
    this.life-=dt;
  }
  draw() {
    const a = clamp(this.life/this.maxLife,0,1);
    ctx.globalAlpha = a;
    ctx.fillStyle = this.col;
    ctx.beginPath();
    ctx.arc(this.x,this.y,Math.max(0.5,this.r*a),0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  get dead() { return this.life<=0; }
}

function boom(x,y,col,n=18,rMin=2,rMax=5) {
  for (let i=0;i<n;i++) {
    const spd=rnd(60,280), a=rnd(0,Math.PI*2);
    particles.push(new Particle(x,y,Math.cos(a)*spd,Math.sin(a)*spd,col,rnd(0.25,0.75),rnd(rMin,rMax)));
  }
  particles.push(new Particle(x,y,0,0,'#fff',0.1,20));
}

function muzzleFlash(x,y) {
  for (let i=0;i<8;i++) {
    const spd=rnd(30,150), a=rnd(0,Math.PI*2);
    particles.push(new Particle(x,y,Math.cos(a)*spd,Math.sin(a)*spd,'#ffe066',rnd(0.04,0.14),rnd(1,3)));
  }
}

function hitSpark(x,y) {
  for (let i=0;i<5;i++) {
    const spd=rnd(40,120), a=rnd(0,Math.PI*2);
    particles.push(new Particle(x,y,Math.cos(a)*spd,Math.sin(a)*spd,'#fff',rnd(0.05,0.15),rnd(1,2)));
  }
}

// ─────────────────────────────────────────────
// BULLET
// ─────────────────────────────────────────────
const bullets = [];

class Bullet {
  constructor(x,y,angle,speed,col,fromPlayer) {
    this.x=x; this.y=y;
    this.vx=Math.cos(angle)*speed;
    this.vy=Math.sin(angle)*speed;
    this.col=col; this.fromPlayer=fromPlayer;
    this.r = fromPlayer ? 4 : 5;
    this.trail=[]; this.dead=false;
  }
  update(dt) {
    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>7) this.trail.shift();
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    if(this.x<-40||this.x>W+40||this.y<-40||this.y>H+40) this.dead=true;
  }
  draw() {
    for(let i=0;i<this.trail.length;i++) {
      ctx.globalAlpha=(i/this.trail.length)*0.45;
      ctx.fillStyle=this.col;
      ctx.beginPath();
      ctx.arc(this.trail[i].x,this.trail[i].y,this.r*(i/this.trail.length)*0.8,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle=this.col;
    ctx.shadowColor=this.col; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
}

// ─────────────────────────────────────────────
// PLAYER
// ─────────────────────────────────────────────
class Player {
  constructor() {
    this.x=W/2; this.y=H/2; this.r=18;
    this.spd=210; this.hp=100; this.maxHp=100;
    this.angle=0; this.moving=false; this.legT=0;
    this.fireCd=0; this.fireRate=0.14;
    this.ammo=30; this.maxAmmo=30;
    this.reloading=false; this.reloadT=0; this.reloadMax=1.5;
    this.hitFlash=0; this.invT=0;
  }
  update(dt) {
    let dx=0,dy=0;
    if(keys['ArrowLeft'] ||keys['KeyA']) dx-=1;
    if(keys['ArrowRight']||keys['KeyD']) dx+=1;
    if(keys['ArrowUp']   ||keys['KeyW']) dy-=1;
    if(keys['ArrowDown'] ||keys['KeyS']) dy+=1;
    if(dx&&dy){dx*=0.707;dy*=0.707;}
    this.moving=(dx!==0||dy!==0);
    this.x=clamp(this.x+dx*this.spd*dt,this.r,W-this.r);
    this.y=clamp(this.y+dy*this.spd*dt,this.r,H-this.r);
    this.angle=Math.atan2(mouse.y-this.y,mouse.x-this.x);
    if(this.moving) this.legT+=dt*12;
    this.hitFlash=Math.max(0,this.hitFlash-dt*4);
    this.invT=Math.max(0,this.invT-dt);
    this.fireCd=Math.max(0,this.fireCd-dt);
    // reload
    if(this.reloading) {
      this.reloadT-=dt;
      if(this.reloadT<=0){ this.ammo=this.maxAmmo; this.reloading=false; }
    }
    if((keys['KeyR']||this.ammo===0)&&!this.reloading) this.reload();
    // fire
    if(mouse.fire&&!this.reloading&&this.ammo>0&&this.fireCd<=0) this.fire();
  }
  reload() { this.reloading=true; this.reloadT=this.reloadMax; }
  fire() {
    this.fireCd=this.fireRate; this.ammo--;
    const bx=this.x+Math.cos(this.angle)*(this.r+12);
    const by=this.y+Math.sin(this.angle)*(this.r+12);
    bullets.push(new Bullet(bx,by,this.angle,620,'#ffe066',true));
    muzzleFlash(bx,by);
    shake(2,0.06);
  }
  hit(dmg) {
    if(this.invT>0) return;
    this.hp=Math.max(0,this.hp-dmg);
    this.hitFlash=1; this.invT=0.6;
    shake(10,0.35);
  }
  draw() {
    ctx.save(); ctx.translate(this.x,this.y);
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(4,5,this.r,this.r*0.6,0,0,Math.PI*2); ctx.fill();
    // legs
    const lc='#1a6e65';
    const swg=Math.sin(this.legT)*9;
    const legA=this.moving?swg:7;
    ctx.fillStyle=lc;
    ctx.beginPath(); ctx.ellipse(-6,legA,5,8,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6,-legA,5,8,0,0,Math.PI*2); ctx.fill();
    // body
    const flash=this.hitFlash;
    if(flash>0) {
      ctx.fillStyle=`rgba(255,255,255,${flash})`;
    } else {
      ctx.fillStyle='#2ec4b6';
    }
    ctx.strokeStyle='#1a7a6e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // gun barrel
    ctx.rotate(this.angle);
    ctx.fillStyle='#4a4a4a'; ctx.strokeStyle='#222'; ctx.lineWidth=1;
    ctx.fillRect(this.r-2,-5,20,10); ctx.strokeRect(this.r-2,-5,20,10);
    ctx.fillStyle='#666'; ctx.fillRect(this.r+2,-3,12,6);
    ctx.rotate(-this.angle);
    // helmet
    ctx.fillStyle='#1c7a70';
    ctx.beginPath(); ctx.arc(0,0,this.r*0.52,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#00f5d4'; ctx.globalAlpha=0.65;
    ctx.beginPath(); ctx.arc(-2,-3,this.r*0.27,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    ctx.restore();
  }
}

// ─────────────────────────────────────────────
// ENEMY
// ─────────────────────────────────────────────
class Enemy {
  constructor(type,x,y,mult) {
    const d=EDEFS[type];
    this.type=type; this.x=x; this.y=y;
    this.r=d.r; this.spd=d.spd*mult;
    this.hp=d.hp; this.maxHp=d.hp;
    this.col=d.col; this.sc=d.sc; this.shoots=d.shoots;
    this.angle=0; this.legT=rnd(0,Math.PI*2);
    this.hitFlash=0; this.dead=false;
    this.fireCd=rnd(1,3); this.fireRate=2.2;
    this.keepDist=this.shoots?230:0;
    this.flankOff=(Math.random()<0.5?1:-1)*rnd(0.4,0.9);
    this.flankT=rnd(0,5);
  }
  update(dt,player) {
    this.hitFlash=Math.max(0,this.hitFlash-dt*5);
    this.legT+=dt*9;
    const dx=player.x-this.x, dy=player.y-this.y;
    const d=Math.hypot(dx,dy);
    this.angle=Math.atan2(dy,dx);
    let mx=0,my=0;
    if(this.type==='FLANKER') {
      this.flankT+=dt;
      const fa=this.angle+this.flankOff*Math.sin(this.flankT*1.4);
      mx=Math.cos(fa); my=Math.sin(fa);
    } else if(this.type==='SHOOTER') {
      if(d<this.keepDist-30) {
        mx=-Math.cos(this.angle); my=-Math.sin(this.angle);
      } else if(d>this.keepDist+50) {
        mx=Math.cos(this.angle)*0.5; my=Math.sin(this.angle)*0.5;
      }
      this.fireCd-=dt;
      if(this.fireCd<=0&&d<450) {
        this.fireCd=this.fireRate;
        const jitter=rnd(-0.08,0.08);
        bullets.push(new Bullet(this.x,this.y,this.angle+jitter,200,'#c77dff',false));
      }
    } else {
      mx=Math.cos(this.angle); my=Math.sin(this.angle);
    }
    this.x+=mx*this.spd*dt; this.y+=my*this.spd*dt;
  }
  hit(dmg) {
    this.hp-=dmg; this.hitFlash=1;
    if(this.hp<=0) {
      this.dead=true;
      boom(this.x,this.y,this.col,this.type==='TANK'?32:20);
      return true;
    }
    hitSpark(this.x,this.y);
    return false;
  }
  draw() {
    ctx.save(); ctx.translate(this.x,this.y);
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(4,4,this.r,this.r*0.6,0,0,Math.PI*2); ctx.fill();
    // legs
    const swg=Math.sin(this.legT)*6;
    const lax=Math.cos(this.angle+Math.PI/2)*this.r*0.45;
    const lay=Math.sin(this.angle+Math.PI/2)*this.r*0.45;
    ctx.fillStyle=this.col+'88';
    ctx.beginPath(); ctx.ellipse(lax+Math.cos(this.angle)*swg,lay+Math.sin(this.angle)*swg,4,6,this.angle,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-lax-Math.cos(this.angle)*swg,-lay-Math.sin(this.angle)*swg,4,6,this.angle,0,Math.PI*2); ctx.fill();
    // body
    const bc=this.hitFlash>0?`rgba(255,255,255,${this.hitFlash})`:this.col;
    ctx.fillStyle=bc; ctx.strokeStyle=this.col+'bb'; ctx.lineWidth=2;
    ctx.beginPath();
    if(this.type==='TANK') {
      ctx.save(); ctx.rotate(this.angle);
      for(let i=0;i<6;i++){
        const a=(i/6)*Math.PI*2-Math.PI/6;
        i===0?ctx.moveTo(Math.cos(a)*this.r,Math.sin(a)*this.r):ctx.lineTo(Math.cos(a)*this.r,Math.sin(a)*this.r);
      }
      ctx.closePath(); ctx.restore();
    } else {
      ctx.arc(0,0,this.r,0,Math.PI*2);
    }
    ctx.fill(); ctx.stroke();
    // direction details
    ctx.rotate(this.angle);
    if(this.type==='SHOOTER') {
      ctx.fillStyle='#555'; ctx.fillRect(this.r*0.35,-3.5,this.r*0.85,7);
    }
    // eye
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(this.r*0.4,-this.r*0.22,this.r*0.18,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(this.r*0.44,-this.r*0.22,this.r*0.09,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // hp bar (multi-hp)
    if(this.maxHp>1) {
      const bw=this.r*2.4, bh=4;
      const bx=this.x-bw/2, by=this.y-this.r-10;
      ctx.fillStyle='#222'; ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle=this.col; ctx.fillRect(bx,by,bw*(this.hp/this.maxHp),bh);
      ctx.strokeStyle='#555'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
    }
  }
}

// ─────────────────────────────────────────────
// GAME STATE
// ─────────────────────────────────────────────
let state=S.MENU;
let player, enemies, score, highScore=0;
let lvlIdx=0, waveIdx=0;
let waveClearDelay=0;
let lvlCompleteTimer=0;
let blinkT=0;
let floatT=0;
let waveNoticeT=0;
let victoryMode=false;

// starfield for menu
const STARS=[];
for(let i=0;i<150;i++) STARS.push({x:rnd(0,1500),y:rnd(0,900),r:rnd(0.5,2.2),spd:rnd(0.15,1.1)});

function initGame() {
  player=new Player();
  enemies=[];
  bullets.length=0;
  particles.length=0;
  score=0; lvlIdx=0; waveIdx=0;
  waveClearDelay=0; waveNoticeT=0;
  victoryMode=false;
  spawnWave();
}

function spawnWave() {
  const mult=1+lvlIdx*0.18;
  const waveDef=LEVELS[lvlIdx][waveIdx];
  waveDef.forEach(g=>{
    for(let i=0;i<g.n;i++){
      const p=edgePos();
      enemies.push(new Enemy(g.t,p.x,p.y,mult));
    }
  });
}

function advanceWave() {
  waveIdx++;
  if(waveIdx>=LEVELS[lvlIdx].length) {
    lvlIdx++;
    if(lvlIdx>=LEVELS.length) {
      // victory
      victoryMode=true;
      state=S.GAME_OVER;
      if(score>highScore) highScore=score;
    } else {
      state=S.LEVEL_COMPLETE;
      lvlCompleteTimer=3.5;
    }
  } else {
    waveNoticeT=2.0;
    waveClearDelay=2.0;
  }
}

// ─────────────────────────────────────────────
// UPDATE
// ─────────────────────────────────────────────
function update(dt) {
  blinkT+=dt*2; floatT+=dt;

  // shake
  if(shkDur>0){ shkDur-=dt; shkX=(Math.random()-0.5)*shkMag*2; shkY=(Math.random()-0.5)*shkMag*2; }
  else { shkX=shkY=shkMag=0; }

  // ── MENU ──
  if(state===S.MENU) {
    STARS.forEach(s=>{ s.y+=s.spd*0.5; if(s.y>H)s.y=0; });
    if(enterPressed()) { initGame(); state=S.PLAYING; }
    return;
  }

  // ── LEVEL COMPLETE ──
  if(state===S.LEVEL_COMPLETE) {
    lvlCompleteTimer-=dt;
    if(lvlCompleteTimer<=0||enterPressed()) {
      player.hp=Math.min(player.maxHp,player.hp+25);
      waveIdx=0; enemies=[]; bullets.length=0; particles.length=0;
      waveClearDelay=0; waveNoticeT=0;
      spawnWave();
      state=S.PLAYING;
    }
    return;
  }

  // ── GAME OVER ──
  if(state===S.GAME_OVER) {
    particles.forEach(p=>p.update(dt));
    particles.splice(0,particles.length,...particles.filter(p=>!p.dead));
    if(enterPressed()) { state=S.MENU; }
    return;
  }

  // ── PLAYING ──
  player.update(dt);

  if(waveClearDelay>0) {
    waveClearDelay-=dt;
    if(waveClearDelay<=0) spawnWave();
  }
  if(waveNoticeT>0) waveNoticeT-=dt;

  enemies.forEach(e=>e.update(dt,player));

  // update bullets
  for(let i=bullets.length-1;i>=0;i--) {
    const b=bullets[i];
    b.update(dt);
    if(b.dead){ bullets.splice(i,1); continue; }

    if(b.fromPlayer) {
      // vs enemies
      let hit=false;
      for(let j=enemies.length-1;j>=0;j--) {
        const e=enemies[j];
        if(e.dead) continue;
        if(dist(b,e)<b.r+e.r) {
          const killed=e.hit(1);
          if(killed) { score+=e.sc; enemies.splice(j,1); }
          hitSpark(b.x,b.y);
          b.dead=true; bullets.splice(i,1); hit=true; break;
        }
      }
      if(hit) continue;
    } else {
      // enemy bullet vs player
      if(dist(b,player)<b.r+player.r) {
        player.hit(1);
        hitSpark(b.x,b.y);
        b.dead=true; bullets.splice(i,1);
      }
    }
  }

  // enemy vs player contact
  for(let j=enemies.length-1;j>=0;j--) {
    const e=enemies[j];
    if(dist(e,player)<e.r+player.r) {
      player.hit(e.type==='TANK'?2:1);
      const a=ang(player,e);
      e.x+=Math.cos(a)*25; e.y+=Math.sin(a)*25;
    }
  }

  // update particles
  particles.forEach(p=>p.update(dt));
  particles.splice(0,particles.length,...particles.filter(p=>!p.dead));

  // wave clear check
  if(enemies.length===0&&waveClearDelay<=0&&state===S.PLAYING) {
    advanceWave();
  }

  // player death
  if(player.hp<=0) {
    boom(player.x,player.y,'#2ec4b6',35);
    victoryMode=false;
    state=S.GAME_OVER;
    if(score>highScore) highScore=score;
  }
}

// ─────────────────────────────────────────────
// DRAW HELPERS
// ─────────────────────────────────────────────
function drawGrid() {
  const gs=64;
  ctx.strokeStyle='rgba(255,255,255,0.035)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

function scanlines() {
  ctx.fillStyle='rgba(0,0,0,0.07)';
  for(let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
}

function label(txt,x,y,col,sz,align='center') {
  ctx.font=`bold ${sz}px monospace`;
  ctx.textAlign=align;
  ctx.fillStyle=col;
  ctx.fillText(txt,x,y);
}

function glowLabel(txt,x,y,col,sz,glowCol,blur=20) {
  ctx.font=`bold ${sz}px monospace`;
  ctx.textAlign='center';
  ctx.shadowColor=glowCol||col; ctx.shadowBlur=blur;
  ctx.fillStyle=col;
  ctx.fillText(txt,x,y);
  ctx.shadowBlur=0;
}

// ─────────────────────────────────────────────
// HUD
// ─────────────────────────────────────────────
function drawHUD() {
  const pad=16;
  // HP bar
  const hbw=200,hbh=20;
  ctx.fillStyle='#111'; ctx.fillRect(pad,pad,hbw,hbh);
  const hp=player.hp/player.maxHp;
  ctx.fillStyle=hp>0.5?'#2ec4b6':hp>0.25?'#f4a261':'#e63946';
  ctx.fillRect(pad,pad,hbw*hp,hbh);
  ctx.strokeStyle='#444'; ctx.lineWidth=1; ctx.strokeRect(pad,pad,hbw,hbh);
  ctx.font='bold 11px monospace'; ctx.textAlign='left';
  ctx.fillStyle='#fff'; ctx.fillText(`HP  ${player.hp}/${player.maxHp}`,pad+6,pad+14);

  // Ammo / reload
  const ax=W-pad-170;
  if(player.reloading) {
    const prog=1-(player.reloadT/player.reloadMax);
    ctx.fillStyle='#f4a261'; ctx.font='bold 13px monospace'; ctx.textAlign='right';
    ctx.fillText('RELOADING...',W-pad,pad+14);
    ctx.fillStyle='#333'; ctx.fillRect(ax,pad+18,155,5);
    ctx.fillStyle='#f4a261'; ctx.fillRect(ax,pad+18,155*prog,5);
    ctx.strokeStyle='#555'; ctx.lineWidth=1; ctx.strokeRect(ax,pad+18,155,5);
  } else {
    ctx.textAlign='right'; ctx.font='bold 13px monospace';
    ctx.fillStyle=player.ammo<8?'#e63946':'#ffe066';
    ctx.fillText(`AMMO ${player.ammo}/${player.maxAmmo}`,W-pad,pad+14);
    for(let i=0;i<player.maxAmmo;i++) {
      ctx.fillStyle=i<player.ammo?'#ffe066':'#333';
      ctx.fillRect(ax+i*5.1,pad+20,4,9);
    }
  }

  // Score / level / wave
  ctx.textAlign='center';
  ctx.font='bold 17px monospace'; ctx.fillStyle='#fff';
  ctx.fillText(`SCORE: ${score}`,W/2,pad+15);
  ctx.font='11px monospace'; ctx.fillStyle='#777';
  const totalWaves=LEVELS[lvlIdx]?LEVELS[lvlIdx].length:0;
  ctx.fillText(`LEVEL ${lvlIdx+1}   WAVE ${waveIdx+1}/${totalWaves}`,W/2,pad+31);

  // Wave clear notice
  if(waveNoticeT>0) {
    const a=clamp(waveNoticeT,0,1);
    ctx.globalAlpha=a;
    glowLabel('WAVE CLEAR!',W/2,H/2-50,'#ffe066',34,'#ffe066',25);
    ctx.globalAlpha=1;
  }

  // Crosshair dot (visual only, cursor is crosshair)
  ctx.fillStyle='rgba(255,230,100,0.6)';
  ctx.beginPath(); ctx.arc(mouse.x,mouse.y,3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,230,100,0.4)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(mouse.x,mouse.y,10,0,Math.PI*2); ctx.stroke();
}

// ─────────────────────────────────────────────
// SCREENS
// ─────────────────────────────────────────────
function drawMenu() {
  // starfield bg
  ctx.fillStyle='#080810'; ctx.fillRect(0,0,W,H);
  STARS.forEach(s=>{
    const nx=(s.x/1500)*W, ny=(s.y/900)*H;
    ctx.fillStyle=`rgba(255,255,255,${0.2+s.spd*0.4})`;
    ctx.beginPath(); ctx.arc(nx,ny,s.r,0,Math.PI*2); ctx.fill();
  });
  // grid
  ctx.strokeStyle='rgba(46,196,182,0.07)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  const cy=H/2;
  // title
  glowLabel('TOP-DOWN',W/2,cy-70,'#2ec4b6',66,'#2ec4b6',35);
  glowLabel('SHOOTER', W/2,cy+5, '#ffe066',66,'#ffe066',35);

  // blink prompt
  if(Math.sin(blinkT)>0) {
    label('PRESS  ENTER  TO  PLAY',W/2,cy+70,'#fff',20);
  }

  // controls
  label('MOVE: ARROWS / WASD     AIM & SHOOT: MOUSE     RELOAD: R',W/2,cy+110,'#555',13);

  // enemy legend
  const ex=W/2-260, ey=cy+155;
  label('ENEMIES:',ex-40,ey,'#888',12,'left');
  const legend=[
    {col:'#e63946',name:'GRUNT  — fast & numerous'},
    {col:'#7b2d2d',name:'TANK   — slow, 4 hits'},
    {col:'#f4a261',name:'FLANKER — quick, curves'},
    {col:'#9b5de5',name:'SHOOTER — keeps distance, fires back'},
  ];
  legend.forEach((l,i)=>{
    ctx.fillStyle=l.col;
    ctx.beginPath(); ctx.arc(ex,ey+20+i*22,6,0,Math.PI*2); ctx.fill();
    label(l.name,ex+14,ey+25+i*22,'#888',12,'left');
  });

  if(highScore>0) {
    glowLabel(`HIGH SCORE: ${highScore}`,W/2,cy+175+(legend.length*22)-70,'#f4a261',17,'#f4a261',12);
  }
}

function drawLevelComplete() {
  ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
  const float=Math.sin(floatT*2)*6;
  glowLabel(`LEVEL ${lvlIdx} COMPLETE!`,W/2,H/2-45+float,'#ffe066',50,'#ffe066',28);
  label(`SCORE: ${score}`,W/2,H/2+20,'#2ec4b6',24);
  label('+25 HP RESTORED',W/2,H/2+54,'#888',15);
  if(Math.sin(blinkT)>0) label('PRESS ENTER TO CONTINUE',W/2,H/2+90,'#fff',16);
}

function drawGameOver() {
  ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,W,H);
  particles.forEach(p=>p.draw());
  const float=Math.sin(floatT*1.8)*5;
  if(victoryMode) {
    glowLabel('YOU WIN!',W/2,H/2-60+float,'#ffe066',60,'#ffe066',35);
    label('ALL LEVELS CLEARED',W/2,H/2-5,'#2ec4b6',22);
  } else {
    glowLabel('GAME OVER',W/2,H/2-60+float,'#e63946',60,'#e63946',35);
    label(`REACHED LEVEL ${lvlIdx+1}`,W/2,H/2-5,'#aaa',20);
  }
  label(`FINAL SCORE: ${score}`,W/2,H/2+38,'#fff',24);
  label(`HIGH SCORE: ${highScore}`,W/2,H/2+72,'#f4a261',18);
  if(Math.sin(blinkT)>0) label('PRESS ENTER TO RETURN TO MENU',W/2,H/2+112,'#666',15);
}

// ─────────────────────────────────────────────
// DRAW
// ─────────────────────────────────────────────
function draw() {
  if(state===S.MENU){ drawMenu(); scanlines(); return; }

  ctx.save();
  ctx.translate(shkX,shkY);
  ctx.fillStyle='#0d0d0e'; ctx.fillRect(-20,-20,W+40,H+40);
  drawGrid();
  particles.forEach(p=>p.draw());
  enemies.forEach(e=>e.draw());
  bullets.forEach(b=>b.draw());
  if(state===S.PLAYING||state===S.LEVEL_COMPLETE) player.draw();
  ctx.restore();

  scanlines();

  if(state===S.PLAYING) drawHUD();
  if(state===S.LEVEL_COMPLETE){ drawHUD(); drawLevelComplete(); }
  if(state===S.GAME_OVER) drawGameOver();
}

// ─────────────────────────────────────────────
// GAME LOOP
// ─────────────────────────────────────────────
let last=0;
function loop(ts) {
  const dt=Math.min((ts-last)/1000, 0.05);
  last=ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
